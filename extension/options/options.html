  <h1 data-i18n="optionsTitle">bonis oculis settings</h1>
  <span class="bo-tag" data-i18n="betaTag">Beta</span>
  <div class="bo-lang" role="group" aria-labelledby="langLabel">
    <span id="langLabel" class="bo-sr-only" data-i18n="languageLabel">Language</span>
    <button type="button" class="bo-lang__opt" data-lang="en" lang="en" aria-pressed="false">EN</button>
    <button type="button" class="bo-lang__opt" data-lang="es" lang="es" aria-pressed="false">ES</button>
  </div>
</header>
<main class="bo-omain">
  <section class="bo-card bo-osec" aria-labelledby="defaultsTitle">
    <h2 id="defaultsTitle" data-i18n="levelsDefaultsTitle">What to skip by default</h2>
    <p class="bo-hint" data-i18n="defaultsHelp"></p>
    <div class="bo-presets">
      <button type="button" id="presetLittle" class="bo-button bo-button--secondary bo-button--sm"><span data-i18n="presetLittle">Little kids</span></button>
      <button type="button" id="presetTeens" class="bo-button bo-button--secondary bo-button--sm"><span data-i18n="presetTeens">Teens</span></button>
    </div>
    <div id="levels"></div>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="sitesTitle">
    <h2 id="sitesTitle" data-i18n="sitesTitle">Websites</h2>
    <p data-i18n="sitesBuiltIn"></p>
    <p id="sitesStatus" class="bo-hint"></p>
    <div class="bo-row">
      <button type="button" id="sitesOn" class="bo-button bo-button--secondary bo-button--sm"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-globe"/></svg><span data-i18n="allowAllSites">Turn on for all websites</span></button>
      <button type="button" id="sitesOff" class="bo-button bo-button--ghost bo-button--sm"><span data-i18n="sitesTurnOff">Turn off for other websites</span></button>
    </div>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="shortcutTitle">
    <h2 id="shortcutTitle" data-i18n="shortcutTitle">Keyboard shortcut</h2>
    <p id="shortcutText"></p>
    <div class="bo-row"><button type="button" id="openShortcuts" class="bo-button bo-button--secondary bo-button--sm"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-keyboard"/></svg><span data-i18n="openShortcuts">Change the shortcut</span></button></div>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="privacyTitle">
    <h2 id="privacyTitle" data-i18n="privacyTitle">Privacy</h2>
    <ul class="bo-points">
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-lock"/></svg><span data-i18n="privacy1"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-eye-off"/></svg><span data-i18n="privacy2"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-shield-check"/></svg><span data-i18n="privacy3"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-check"/></svg><span data-i18n="privacy4"></span></li>
    </ul>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="limitsTitle">
    <h2 id="limitsTitle" data-i18n="limitsTitle">What it can and cannot do</h2>
    <ul class="bo-points">
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg><span data-i18n="limits1"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg><span data-i18n="limits2"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-lock"/></svg><span><span data-i18n="noPinNote"></span> <a class="bo-link" href="https://support.google.com/families/answer/7087030" target="_blank" rel="noopener noreferrer" data-i18n="noPinHelpLink"></a></span></li>
    </ul>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="liveOptTitle">
    <h2 id="liveOptTitle" data-i18n="liveOptTitle">Live listening (experimental)</h2>
    <ul class="bo-points">
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-settings"/></svg><span data-i18n="liveOpt1"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-clock"/></svg><span data-i18n="liveOpt2"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg><span data-i18n="liveOpt3"></span></li>
      <li><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-lock"/></svg><span data-i18n="liveOpt4"></span></li>
    </ul>
  </section>

  <section class="bo-card bo-osec" aria-labelledby="forgetTitle">
    <h2 id="forgetTitle" data-i18n="forgetTitle">Start over</h2>
    <p class="bo-hint" data-i18n="forgetAllHelp"></p>
    <div class="bo-row">
      <button type="button" id="forget" class="bo-button bo-button--secondary bo-button--sm"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-trash"/></svg><span data-i18n="forgetAll">Forget everything</span></button>
    </div>
    <div id="forgetConfirm" class="bo-stack bo-confirm" hidden>
      <p id="forgetConfirmText" data-i18n="forgetAllConfirmText"></p>
      <div class="bo-row">
        <button type="button" id="forgetYes" class="bo-button bo-button--danger bo-button--sm"><span data-i18n="forgetAllConfirm">Yes, forget everything</span></button>
        <button type="button" id="forgetNo" class="bo-button bo-button--primary bo-button--sm"><span data-i18n="keepIt">Keep it</span></button>
      </div>
    </div>
  </section>
</main>
