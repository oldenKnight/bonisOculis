<header class="bo-head">
  <svg class="bo-head__mark" viewBox="0 0 32 32" aria-hidden="true"><path fill-rule="evenodd" d="M1 16C6 4 26 4 31 16C26 28 6 28 1 16ZM16 9.4a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 1 0 0-13.2ZM16 12.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0-6.2ZM17.6 13.7a1.05 1.05 0 1 0 0 2.1a1.05 1.05 0 1 0 0-2.1Z"/></svg>
  <h1 class="bo-head__name">bonis oculis</h1>
  <span class="bo-tag" data-i18n="betaTag">Beta</span>
  <div class="bo-lang" role="group" aria-labelledby="langLabel">
    <span id="langLabel" class="bo-sr-only" data-i18n="languageLabel">Language</span>
    <button type="button" class="bo-lang__opt" data-lang="en" lang="en" aria-pressed="false">EN</button>
    <button type="button" class="bo-lang__opt" data-lang="es" lang="es" aria-pressed="false">ES</button>
  </div>
</header>

<main id="main" class="bo-main">
  <div id="panicNoKey" class="bo-note bo-note--warn" role="alert" hidden>
    <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-alert"/></svg>
    <div class="bo-stack"><p data-i18n="panicNoKey"></p>
      <button type="button" id="openShortcuts" class="bo-button bo-button--secondary bo-button--sm bo-filebtn"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-keyboard"/></svg><span data-i18n="panicNoKeyButton">Choose a shortcut</span></button>
    </div>
  </div>
  <section id="msg" class="bo-card bo-stack" hidden>
    <p id="msgText" class="bo-msg"></p>
    <div id="msgActions" class="bo-stack" hidden>
      <button type="button" id="protectTab" class="bo-button bo-button--primary bo-button--block">
        <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-shield-check"/></svg><span data-i18n="protectThisTab">Protect this tab</span>
      </button>
      <p class="bo-hint" data-i18n="protectThisTabHelp"></p>
      <button type="button" id="allowAll" class="bo-button bo-button--secondary bo-button--block">
        <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-globe"/></svg><span data-i18n="allowAllSites">Turn on for all websites</span>
      </button>
      <p class="bo-hint" data-i18n="allowAllSitesHelp"></p>
    </div>
  </section>

  <div id="ready" class="bo-stack bo-stack--loose" hidden>
    <section class="bo-card bo-status" aria-labelledby="scenesLine">
      <p class="bo-overline"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-globe"/></svg><span><span data-i18n="statusLabel">On this tab</span>: <span id="siteName"></span></span></p>
      <p id="scenesLine" class="bo-status__big bo-display" aria-live="polite"></p>
      <p id="mutesLine" class="bo-status__sub" hidden></p>
      <ul id="catChips" class="bo-chips" hidden></ul>
      <p class="bo-status__source"><span data-i18n="sourceLabel">Reading from</span>: <span id="sourceText"></span></p>
      <div id="noTrack" class="bo-note" hidden>
        <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg>
        <div class="bo-stack"><p id="noTrackText"></p>
          <button type="button" id="readCaptions" class="bo-button bo-button--secondary bo-button--sm" hidden><span data-i18n="readCaptions">Read this video's captions</span></button>
        </div>
      </div>
      <p id="drmNote" class="bo-note" hidden><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-eye-off"/></svg><span data-i18n="drmNote"></span></p>
      <p id="rollingNote" class="bo-note" hidden><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-clock"/></svg><span data-i18n="rollingNote"></span></p>
      <p id="adNote" class="bo-note" hidden><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg><span data-i18n="adNote"></span></p>
    </section>

    <section class="bo-panic">
      <button type="button" id="panicBtn" class="bo-button bo-button--secondary bo-button--lg bo-button--block" aria-pressed="false">
        <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-panic"/></svg><span id="panicLabel"></span>
      </button>
      <p id="panicHint" class="bo-hint"></p>
    </section>

    <section id="liveBox" class="bo-card bo-live" aria-labelledby="liveTitle">
      <div class="bo-live__row">
        <h2 id="liveTitle" class="bo-file__title"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-ear"/></svg><span data-i18n="liveTitle">Live listening (experimental)</span></h2>
        <button type="button" id="liveSwitch" class="bo-switch" role="switch" aria-checked="false" aria-labelledby="liveTitle" aria-describedby="liveHelp"><span class="bo-switch__knob" aria-hidden="true"></span></button>
      </div>
      <p id="liveHelp" class="bo-hint" data-i18n="liveHelp"></p>
      <p id="liveStatus" class="bo-note" hidden><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-info"/></svg><span id="liveStatusText" aria-live="polite"></span></p>
    </section>

    <details id="levelsBox" class="bo-card bo-section">
      <summary data-i18n="levelsTitle">What to skip on this video</summary>
      <div class="bo-section__body">
        <div id="levels"></div>
        <p id="levelsSkipNote" class="bo-hint" data-i18n="levelsFromSkipFile" hidden></p>
        <button type="button" id="resetLevels" class="bo-button bo-button--ghost bo-button--sm" hidden><span data-i18n="resetLevels">Use my defaults</span></button>
        <p class="bo-note"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-lock"/></svg><span><span data-i18n="noPinNote"></span> <a class="bo-link" href="https://support.google.com/families/answer/7087030" target="_blank" rel="noopener noreferrer" data-i18n="noPinHelpLink"></a></span></p>
      </div>
    </details>

    <details id="filesBox" class="bo-card bo-section">
      <summary data-i18n="filesTitle">Your files</summary>
      <div class="bo-section__body">
        <div class="bo-stack">
          <h2 class="bo-file__title" data-i18n="useSubFile">Use a subtitle file</h2>
          <p class="bo-hint" data-i18n="useSubFileHelp"></p>
          <ul id="subList" class="bo-filelist"></ul>
          <label id="subLabel" class="bo-button bo-button--secondary bo-button--sm bo-filebtn" hidden>
            <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-upload"/></svg><span data-i18n="chooseFile">Choose a file</span>
            <input type="file" id="subInput" class="bo-sr-only" accept=".srt,.vtt,text/vtt,application/x-subrip">
          </label>
          <button type="button" id="subWindow" class="bo-button bo-button--secondary bo-button--sm bo-filebtn">
            <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-upload"/></svg><span data-i18n="chooseFile">Choose a file</span>
          </button>
        </div>
        <div class="bo-stack">
          <h2 class="bo-file__title" data-i18n="importSkip">Import a skip file</h2>
          <p class="bo-hint" data-i18n="importSkipHelp"></p>
          <p class="bo-hint" data-i18n="importSkipWhere"></p>
          <ul id="skipList" class="bo-filelist"></ul>
          <label id="skipLabel" class="bo-button bo-button--secondary bo-button--sm bo-filebtn" hidden>
            <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-upload"/></svg><span data-i18n="chooseFile">Choose a file</span>
            <input type="file" id="skipInput" class="bo-sr-only" accept=".json,application/json">
          </label>
          <button type="button" id="skipWindow" class="bo-button bo-button--secondary bo-button--sm bo-filebtn">
            <svg class="bo-icon" aria-hidden="true"><use href="#bo-i-upload"/></svg><span data-i18n="chooseFile">Choose a file</span>
          </button>
        </div>
        <div id="marksBox" class="bo-stack" hidden>
          <h2 class="bo-file__title" data-i18n="marksTitle">Hidden moments on this video</h2>
          <p id="marksCount" class="bo-hint"></p>
          <p class="bo-hint" data-i18n="marksHelp"></p>
          <button type="button" id="forgetMarks" class="bo-button bo-button--secondary bo-button--sm bo-filebtn"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-trash"/></svg><span data-i18n="forgetMarks">Forget my hidden moments</span></button>
          <div id="forgetMarksConfirm" class="bo-stack bo-confirm" hidden>
            <p data-i18n="forgetMarksConfirmText"></p>
            <div class="bo-row">
              <button type="button" id="forgetMarksYes" class="bo-button bo-button--danger bo-button--sm"><span data-i18n="forgetMarksConfirm">Yes, forget them</span></button>
              <button type="button" id="forgetMarksNo" class="bo-button bo-button--primary bo-button--sm"><span data-i18n="keepThem">Keep them</span></button>
            </div>
          </div>
        </div>
        <p id="fileWindowNote" class="bo-hint" data-i18n="fileWindowNote"></p>
      </div>
    </details>

    <details id="timingBox" class="bo-card bo-section">
      <summary data-i18n="timingTitle">Timing</summary>
      <div class="bo-section__body">
        <p class="bo-hint" data-i18n="timingHelp"></p>
        <div id="timingRows" class="bo-stack bo-stack--loose"></div>
        <p id="timingNone" class="bo-hint" data-i18n="timingNone"></p>
      </div>
    </details>
  </div>
</main>

<footer class="bo-foot">
  <button type="button" id="openOptions" class="bo-link"><svg class="bo-icon" aria-hidden="true"><use href="#bo-i-settings"/></svg><span data-i18n="openOptions">Settings and privacy</span></button>
</footer>
<div id="toast" class="bo-toast" role="status" aria-live="polite" hidden></div>

<script src="../shared/skipfile.js"></script>
<script src="../common/i18n.js"></script>
<script src="../common/store.js"></script>
<script src="../common/ui.js"></script>
